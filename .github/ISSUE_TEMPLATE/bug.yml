name: Something went wrong
description: A bug, a crash, or something that did not work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: phone
    attributes:
      label: Phone
      description: Make and model, and Android version (Settings → About phone)
      placeholder: Galaxy S23, Android 16
  - type: input
    id: computer
    attributes:
      label: Computer
      description: Linux distribution or Windows version
      placeholder: Ubuntu 24.04
  - type: dropdown
    id: network
    attributes:
      label: Where were the devices?
      options:
        - Same Wi-Fi
        - Phone on mobile data
        - Different Wi-Fi networks
        - Not sure
  - type: input
    id: version
    attributes:
      label: QurbSpace version
      description: Settings → Update shows it
      placeholder: 0.2.0-beta.10
  - type: textarea
    id: report
    attributes:
      label: Report file
      description: Settings → Advanced → Save a report saves a file; drag it here. It holds how the devices connected, with their network addresses, and no file contents.
