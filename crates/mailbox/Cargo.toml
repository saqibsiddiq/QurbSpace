[package]
name = "qurb-mailbox"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "A person's devices leaving each other what they cannot say live, sealed, in a cloud folder they share"

[dependencies]
blake3.workspace = true
tokio.workspace = true
qurb-engine = { path = "../engine" }
qurb-keys = { path = "../keys" }
qurb-peer = { path = "../peer" }
qurb-storage = { path = "../storage" }
qurb-sync = { path = "../sync" }
chacha20poly1305 = "0.10"
getrandom = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
qurb-watcher = { path = "../watcher" }
tempfile = "3"
